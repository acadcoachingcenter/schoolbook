name = "schoolbook"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "dist"

[ai]
binding = "AI"

[[vectorize]]
binding = "VECTORIZE"
index_name = "schoolbook-ncert"

[[d1_databases]]
binding = "DB"
database_name = "schoolbook-db"
database_id = "aea5ee36-e34a-46f5-be60-7720a67f556f"

[[kv_namespaces]]
binding = "CACHE"
id = "932d37901243485eb5c876448efe0f37"

[[r2_buckets]]
binding = "SOURCE_PDFS"
bucket_name = "schoolbook-source-pdfs"



# Secrets (set via the Cloudflare dashboard, never committed):
#   GROQ_API_KEY
#   GROQ_MODEL
#   ADMIN_INGEST_KEY
